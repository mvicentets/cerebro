<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cérebro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Segundo Cérebro</title>
<style>
/* ================= tokens (paleta do Notion) ================= */
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--card:#ffffff;--text:#37352f;--muted:#787774;--faint:#a3a29e;
  --line:#e9e9e7;--hover:rgba(55,53,47,.06);--press:rgba(55,53,47,.1);
  --accent:#2383e2;--accent-soft:#e7f3f8;--danger:#eb5757;--good:#448361;
  --shadow:0 0 0 1px rgba(15,15,15,.06),0 2px 4px rgba(15,15,15,.05);
  --shadow-lg:0 0 0 1px rgba(15,15,15,.05),0 6px 16px rgba(15,15,15,.12);
  --fab:#37352f;--fabtxt:#fff;--overlay:rgba(15,15,15,.4);--glass:rgba(255,255,255,.78);
  /* tags */
  --gray-bg:#f1f1ef;--gray-fg:#787774;--brown-bg:#f4eeee;--brown-fg:#9f6b53;--orange-bg:#fbecdd;--orange-fg:#d9730d;
  --yellow-bg:#fbf3db;--yellow-fg:#cb912f;--green-bg:#edf3ec;--green-fg:#448361;--blue-bg:#e7f3f8;--blue-fg:#337ea9;
  --purple-bg:#f6f3f9;--purple-fg:#9065b0;--pink-bg:#faf1f5;--pink-fg:#c14c8a;--red-bg:#fdebec;--red-fg:#d44c47;
  --ios:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191919;--bg2:#202020;--card:#252525;--text:rgba(255,255,255,.87);--muted:#9b9b9b;--faint:#6f6f6f;
  --line:#2f2f2f;--hover:rgba(255,255,255,.055);--press:rgba(255,255,255,.09);
  --accent:#2f8de4;--accent-soft:#1d2f3d;--danger:#e66a6a;--good:#5aa47a;
  --shadow:0 0 0 1px rgba(255,255,255,.07);--shadow-lg:0 0 0 1px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.5);
  --fab:#ebebea;--fabtxt:#191919;--overlay:rgba(0,0,0,.6);--glass:rgba(25,25,25,.78);
  --gray-bg:#2f2f2f;--gray-fg:#9b9b9b;--brown-bg:#3a2d27;--brown-fg:#ba856f;--orange-bg:#3d2a1b;--orange-fg:#e08c4a;
  --yellow-bg:#3b3220;--yellow-fg:#d1a54b;--green-bg:#1f3227;--green-fg:#5aa47a;--blue-bg:#1a2f3d;--blue-fg:#4f9bd0;
  --purple-bg:#2f2538;--purple-fg:#a882c7;--pink-bg:#382430;--pink-fg:#d06aa2;--red-bg:#3d2322;--red-fg:#e06b66;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior-y:none;
  font:16px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:transparent;border:0;outline:none;width:100%;border-radius:6px;padding:7px 8px}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
/* toque estilo iOS */
button,.tap{transition:transform .18s var(--ios),background-color .15s,opacity .15s}
button:active,.tap:active{transform:scale(.96)}
.row.tap:active,.list .tap:active{transform:none;background:var(--press)}

/* ================= barra superior (título compacto ao rolar) ================= */
.topbar{position:fixed;top:0;left:0;right:0;z-index:8;height:calc(env(safe-area-inset-top) + 46px);
  padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid transparent;transition:background-color .25s,border-color .25s}
.topbar.solid{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-color:var(--line)}
.topbar .tt{font-weight:600;font-size:16px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .35s var(--ios)}
.topbar.solid .tt{opacity:1;transform:none}
.topbar .gear{position:absolute;right:10px;bottom:5px;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.topbar .gear svg{width:22px;height:22px}

#app{transition:transform .5s var(--ios),filter .5s var(--ios);transform-origin:50% 0}
body.sheet-open #app{transform:scale(.94);filter:brightness(.92)}
.pagehead{padding:calc(env(safe-area-inset-top) + 52px) 20px 6px;max-width:680px;margin:0 auto}
.pagehead .icon{font-size:44px;line-height:1;display:inline-block;margin-bottom:6px;animation:iconPop .6s var(--spring) both}
.pagehead h1{margin:0;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.pagehead .sub{color:var(--muted);font-size:14px;margin-top:2px}
.pagehead .sub::first-letter{text-transform:uppercase}
main{padding:6px 20px calc(110px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
@keyframes iconPop{from{transform:scale(.4) rotate(-12deg);opacity:0}}

/* ================= navegação inferior (vidro) ================= */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;padding:4px 6px env(safe-area-inset-bottom);
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;font-size:10.5px;color:var(--faint);font-weight:500}
.nav button svg{width:24px;height:24px;transition:transform .4s var(--spring)}
.nav button.on{color:var(--text)}
.nav button.on svg{transform:scale(1.08)}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:9;width:54px;height:54px;border-radius:50%;
  background:var(--fab);color:var(--fabtxt);box-shadow:var(--shadow-lg);display:grid;place-items:center;
  transition:transform .4s var(--spring),opacity .25s}
.fab svg{width:24px;height:24px}
.fab.hide{transform:scale(0);opacity:0;pointer-events:none}

/* ================= blocos estilo Notion ================= */
.seg{position:relative;display:flex;background:var(--hover);border-radius:9px;padding:3px;margin:6px 0 14px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:7px;background:var(--card);
  box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .45s var(--ios)}
.seg button{position:relative;flex:1;padding:6px 0;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{color:var(--text);font-weight:600}
.seg button:active{transform:none}

.navrow{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.navrow .arr{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:20px;display:grid;place-items:center}
.navrow .arr:active{background:var(--hover)}
.navrow .lbl{flex:1}
.navrow .lbl b{display:block;font-size:20px;font-weight:700}
.navrow .lbl b::first-letter,.navrow .lbl span::first-letter{text-transform:uppercase}
.navrow .lbl span{display:block;font-size:13px;color:var(--muted)}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--hover);color:var(--muted);font-weight:500}

.h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.h h3{margin:0;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.h h3 .n{color:var(--faint);font-weight:400;font-size:14px}
.h button{font-size:14px;color:var(--muted);padding:2px 6px;border-radius:5px}
.h button:active{background:var(--hover)}

.row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:6px;min-height:40px}
.empty{color:var(--faint);font-size:14px;padding:10px 4px}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--gray-bg);border-radius:8px;padding:12px 14px;margin:8px 0;font-size:15px}
.callout .ci{font-size:20px;line-height:1.3}
.callout.yellow{background:var(--yellow-bg)}.callout.blue{background:var(--blue-bg)}.callout.green{background:var(--green-bg)}.callout.red{background:var(--red-bg)}
.callout .btn{margin-top:8px}
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px}

.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:4px;font-size:13px;line-height:20px;white-space:nowrap;
  background:var(--gray-bg);color:var(--text)}
.tg-gray{background:var(--gray-bg)}.tg-brown{background:var(--brown-bg)}.tg-orange{background:var(--orange-bg)}.tg-yellow{background:var(--yellow-bg)}
.tg-green{background:var(--green-bg)}.tg-blue{background:var(--blue-bg)}.tg-purple{background:var(--purple-bg)}.tg-pink{background:var(--pink-bg)}.tg-red{background:var(--red-bg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;background:var(--accent);color:#fff;font-weight:500;font-size:15px}
.btn.ghost{background:var(--hover);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.block{width:100%;margin-top:8px}
.btn.sm{padding:5px 10px;font-size:13px}

.chips{display:flex;gap:6px;overflow-x:auto;margin:4px -20px 10px;padding:0 20px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:4px 10px;border-radius:99px;font-size:14px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--text);color:var(--bg);box-shadow:none}

/* tarefas (to-do do Notion) */
.task{display:flex;align-items:flex-start;gap:10px;padding:6px 4px;border-radius:6px}
.chk{width:18px;height:18px;margin-top:3px;flex-shrink:0;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--muted);display:grid;place-items:center;
  transition:background-color .2s,box-shadow .2s,transform .2s var(--ios)}
.chk svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s var(--ios)}
.task.done .chk{background:var(--accent);box-shadow:none}
.task.done .chk svg{stroke-dashoffset:0}
.chk.pop{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.task .tt{flex:1;min-width:0;position:relative}
.task .tt .txt{background:linear-gradient(currentColor,currentColor) no-repeat 0 55%/0 1px;transition:background-size .35s var(--ios),color .25s}
.task.done .tt .txt{color:var(--faint);background-size:100% 1px}
.task .sub{display:block;font-size:12px;color:var(--red-fg)}
.flag{color:var(--red-fg);font-weight:700;margin-left:4px}
.mini{font-size:13px;padding:2px 8px;border-radius:5px;background:var(--hover);color:var(--muted);font-weight:500;white-space:nowrap}
.quick{display:flex;gap:10px;align-items:center;padding:4px 4px}
.quick .plus{width:18px;height:18px;color:var(--faint);font-size:20px;line-height:18px;text-align:center;flex-shrink:0}
.quick input{padding:5px 0}

/* treinos */
.wo{display:flex;gap:12px;align-items:flex-start}
.wo .ic{font-size:22px;line-height:1.3}
.wo .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wo .meta{font-size:13px;color:var(--muted);margin-top:2px}
.wo p{margin:4px 0 0;font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.time{font-size:12px;color:var(--faint)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:8px 0}
.stat{border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);background:var(--card)}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stats.two{grid-template-columns:1fr 1fr}
.stat b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--hover);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transform-origin:left;animation:growX .8s var(--ios) both}
@keyframes growX{from{transform:scaleX(0)}}
.brow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.brow .bar{flex:1;margin:0}

/* diário / notas */
.jr{display:flex;gap:12px}
.jr .mood{font-size:24px;line-height:1.2}
.jr p,.note p{margin:2px 0 0;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.note b{display:block;font-weight:600}

/* livros: galeria do Notion */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:4px}
.gcard{background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.gcover{position:relative;aspect-ratio:2/2.6;background:var(--c);display:flex;align-items:flex-end;padding:10px;overflow:hidden}
.gcover .ph{font-weight:700;font-size:15px;line-height:1.2;color:var(--text);opacity:.75}
.gcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadeIn .5s}
.gbody{padding:8px 10px 10px}
.gbody b{display:block;font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gbody .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .mini{position:absolute;top:8px;right:8px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--text)}
.stars{color:#e6a23c;font-size:12px;letter-spacing:1px}
.bk{display:flex;gap:12px;align-items:center}
.bk .cv{width:40px;height:58px;border-radius:4px;flex-shrink:0;background:var(--c);overflow:hidden;position:relative;box-shadow:var(--shadow)}
.bk .cv img{width:100%;height:100%;object-fit:cover}
.bk .info{flex:1;min-width:0}
.bk .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:15px}
@keyframes fadeIn{from{opacity:0}}

/* semana */
.wk{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.wk .dd{width:40px;text-align:center}
.wk .dd small{display:block;font-size:11px;color:var(--faint);text-transform:uppercase}
.wk .dd b{font-size:19px;font-weight:600}
.wk.today .dd b{color:#fff;background:var(--red-fg);border-radius:50%;width:32px;height:32px;display:inline-grid;place-items:center;font-size:16px}
.wk .mid{flex:1;font-size:13px;color:var(--muted)}
.wk .icons{font-size:17px;letter-spacing:2px}
.wk .md{font-size:20px;width:26px;text-align:center}

/* mês */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wh{text-align:center;font-size:11px;color:var(--faint);text-transform:uppercase;padding:4px 0}
.cal .c{min-width:0;aspect-ratio:1/1.2;border-radius:8px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;border-top:1px solid var(--line)}
.cal .c .num{width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .c.today .num{background:var(--red-fg);color:#fff;font-weight:600}
.cal .c .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .c .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.cal .c .em{font-size:11px;line-height:1}
.cal .c .tk{width:12px;height:3px;border-radius:2px;background:var(--faint);opacity:.6}
.cal .c .tk.ok{background:var(--accent);opacity:1}

/* uber */
.hero{border-radius:12px;padding:16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:8px}
.hero small{color:var(--muted);font-size:13px}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--red-fg)}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:3px;height:130px;padding:8px 0 0;margin-top:4px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.chart .col i{width:100%;max-width:28px;border-radius:4px 4px 2px 2px;background:var(--green-fg);transform-origin:bottom;animation:growY .7s var(--ios) both;min-height:2px}
.chart .col i.neg{background:var(--red-fg)}
.chart .col i.zero{background:var(--line)}
.chart .col span{font-size:10px;color:var(--faint);height:14px}
@keyframes growY{from{transform:scaleY(0)}}
.prev{font-size:14px;margin:4px 0 10px;padding:10px 12px;border-radius:8px;background:var(--hover)}

/* entrada animada (estilo iOS) */
.enter > *, .enter #carousel > *{animation:rise .55s var(--ios) both}
.enter > *:nth-child(2),.enter #carousel > *:nth-child(2){animation-delay:.03s}
.enter > *:nth-child(3),.enter #carousel > *:nth-child(3){animation-delay:.06s}
.enter > *:nth-child(4),.enter #carousel > *:nth-child(4){animation-delay:.09s}
.enter > *:nth-child(5),.enter #carousel > *:nth-child(5){animation-delay:.12s}
.enter > *:nth-child(6),.enter #carousel > *:nth-child(6){animation-delay:.15s}
.enter > *:nth-child(7),.enter #carousel > *:nth-child(7){animation-delay:.18s}
.enter > *:nth-child(n+8),.enter #carousel > *:nth-child(n+8){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#carousel{touch-action:pan-y;will-change:transform}
.slide-l{animation:slideL .45s var(--ios) both}.slide-r{animation:slideR .45s var(--ios) both}
@keyframes slideL{from{transform:translateX(70px);opacity:0}}
@keyframes slideR{from{transform:translateX(-70px);opacity:0}}

/* ================= folha inferior (modal iOS) ================= */
.ov{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .35s}
.ov.out{opacity:0;transition:opacity .3s}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:93dvh;overflow-y:auto;border-radius:14px 14px 0 0;
  padding:0 20px calc(24px + env(safe-area-inset-bottom));animation:sheetUp .5s var(--ios) both;overscroll-behavior:contain}
.ov.out .sheet{transform:translateY(100%);transition:transform .32s var(--ios)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sh-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:8px 0 8px;z-index:2;touch-action:none}
.sh-head::before{content:"";position:absolute;top:5px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}
.sh-head b{font-size:15px;font-weight:600;padding-top:8px}
.sh-head button{color:var(--muted);font-size:15px;min-width:70px;text-align:left;padding:14px 0 6px}
.sh-head .save{color:var(--accent);font-weight:600;text-align:right}
.ptitle{font-size:26px;font-weight:700;padding:6px 0;line-height:1.25}
.prop{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px;align-items:start;min-height:38px}
.prop > label{color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center;padding:8px 0;white-space:nowrap}
.prop > label .pi{width:18px;text-align:center;opacity:.8}
.prop input:hover,.prop input:focus,.prop textarea:focus,.prop select:focus{background:var(--hover)}
.prop .opts{padding:6px 0}
.pbody{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.pbody textarea{padding:8px 0;min-height:130px;line-height:1.55}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{margin:0;cursor:pointer}
.opts input{display:none}
.opts span{display:inline-block;padding:2px 8px;border-radius:4px;font-size:14px;background:var(--gray-bg);opacity:.55;transition:opacity .2s,box-shadow .2s,transform .3s var(--spring)}
.opts input:checked+span{opacity:1;box-shadow:inset 0 0 0 1.5px var(--text);transform:scale(1.04)}
.opts.moods{justify-content:center}
.opts.moods span{font-size:28px;padding:2px 6px;background:transparent;opacity:.35;filter:grayscale(.6)}
.opts.moods input:checked+span{opacity:1;filter:none;box-shadow:none;transform:scale(1.2)}
.opts.rate span{font-size:20px;background:transparent;color:#e6a23c;padding:0 4px}
.opts.rate input:checked+span{box-shadow:none;background:var(--yellow-bg)}
.menu .row{padding:10px 6px;gap:14px}
.menu .row .mi{font-size:22px;width:30px;text-align:center}
.menu .row b{display:block;font-weight:500}
.menu .row small{color:var(--muted);font-size:13px}
.covers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.covers button{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:11px;color:var(--muted)}
.covers img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;box-shadow:var(--shadow);background:var(--hover)}
.covers span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.cvprev{display:flex;gap:12px;align-items:center}
.cvprev img{width:54px;height:78px;object-fit:cover;border-radius:4px;box-shadow:var(--shadow)}

/* ================= aviso estilo "ilha dinâmica" ================= */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:40;transform:translateX(-50%);
  background:#000;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap;
  animation:island .6s var(--spring) both;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.out{transition:transform .35s var(--ios),opacity .35s;transform:translateX(-50%) translateY(-30px) scale(.7);opacity:0}
@keyframes island{from{transform:translateX(-50%) translateY(-30px) scale(.5);opacity:0}}

/* ================= bloqueio ================= */
.lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;transition:opacity .4s,transform .5s var(--ios)}
.lock.unlock{opacity:0;transform:scale(1.08);pointer-events:none}
.lock .logo{width:64px;height:64px;border-radius:16px;box-shadow:var(--shadow)}
.lock h2{margin:10px 0 0;font-size:20px}
.lock p{margin:0;color:var(--muted)}
.dots2{display:flex;gap:16px;margin:22px 0}
.dots2 i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);transition:background-color .15s,transform .25s var(--spring)}
.dots2 i.f{background:var(--text);box-shadow:none;transform:scale(1.1)}
.dots2.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:16px}
.pad button{height:74px;border-radius:50%;background:var(--hover);font-size:28px;font-weight:400}
.pad button:active{background:var(--press)}
.pad button.x{background:none;font-size:20px;color:var(--muted)}

/* ================= fotos / evolução ================= */
.photos{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.ph-t{position:relative;width:72px;height:72px;flex-shrink:0;border-radius:8px;overflow:hidden;background:var(--hover)}
.ph-t img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.ph-t img.ok{opacity:1}
.ph-t .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:22px;text-align:center}
.ph-add{position:relative;width:72px;height:72px;flex-shrink:0;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;align-content:center;color:var(--muted);font-size:12px;text-align:center;line-height:1.3;cursor:pointer}
.ph-add b{font-size:22px;font-weight:400;display:block}
.sr{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:background-color .35s;touch-action:none}
.lb.on{background:rgba(0,0,0,.95)}
.lb img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .45s var(--ios),opacity .3s;will-change:transform}
.lb .cnt{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:0;right:0;text-align:center;color:#fff;font-size:14px;opacity:.8}
.lb .cls{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:16px}
.wchart{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
.wchart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ios) forwards}
.wchart .ar{opacity:0;animation:appear .8s .5s forwards}
.wchart .dt{fill:var(--card);stroke:var(--accent);stroke-width:2;opacity:0;animation:appear .3s .9s forwards}
.wchart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.wchart text{font-size:10px;fill:var(--faint);font-family:inherit}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes appear{to{opacity:1}}
.rng{display:flex;gap:4px;justify-content:flex-end}
.rng button{font-size:12px;padding:2px 8px;border-radius:5px;color:var(--muted)}
.rng button.on{background:var(--hover);color:var(--text);font-weight:600}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ba figure{margin:0;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--hover);cursor:pointer}
.ba img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ba img.ok{opacity:1}
.ba figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12px}
.ba figcaption b{display:block;font-size:15px}
.res .big{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.pr{font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f5b400,#e07b00);padding:1px 8px;border-radius:99px}
/* ================= painel inicial ================= */
.cd{display:flex;gap:16px;align-items:center;border-radius:14px;padding:16px 18px;background:var(--text);color:var(--bg);margin:6px 0 10px}
.cdn{text-align:center;min-width:76px}
.cdn b{display:block;font-size:48px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cdn span{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.1em}
.cdi{flex:1;min-width:0}
.cdt{font-weight:600;font-size:15px}
.cdc{font-variant-numeric:tabular-nums;font-size:13px;opacity:.75;margin-top:1px}
.cd .bar{background:rgba(127,127,127,.35);margin-top:8px}
.cd .bar i{background:var(--bg)}
.cdp{font-size:12px;opacity:.75;margin-top:6px}
.dashc .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dashc .dh b{font-weight:600}
.dashc .dh button{font-size:13px;color:var(--muted)}
.sqs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;margin:10px 0 8px}
.sq{aspect-ratio:1;border-radius:5px;background:var(--hover);font-size:9px;color:var(--faint);display:grid;place-items:center;padding:0;min-width:0}
.sq.l1{background:color-mix(in srgb,var(--c) 28%,var(--hover))}
.sq.l2{background:color-mix(in srgb,var(--c) 52%,var(--hover))}
.sq.l3{background:color-mix(in srgb,var(--c) 76%,var(--hover))}
.sq.l4{background:var(--c);color:#fff;font-weight:700}
.sq.l2,.sq.l3{color:#fff}
.sq.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.sq.now{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text)}
.sqs.dias,.wrow{--c:var(--green-fg)}
.sqs.conteudo{--c:var(--pink-fg)}
.enter .sq{animation:sqIn .5s var(--spring) both;animation-delay:calc(var(--i,0) * 14ms + .1s)}
@keyframes sqIn{from{transform:scale(.3);opacity:0}}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:3px;align-items:center}
.legend .sq{width:10px;height:10px;border-radius:3px;animation:none!important}
.wrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0 6px}
.wrow > div{display:flex;flex-direction:column;align-items:center;gap:3px}
.wrow .wd{font-size:11px;color:var(--faint);text-transform:uppercase}
.wrow .sq{width:100%;font-size:11px}
.wrow .ic{font-size:13px;min-height:18px;line-height:1.3;text-align:center}
.trend{font-size:14px;margin:8px 0 2px}
.desk-only,.brand{display:none}

/* ================= conteúdo ================= */
.cmp textarea{padding:4px 0;min-height:52px;font-size:16px}
.cmpbar{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.aud{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 5px;margin-top:6px;border-radius:99px;background:var(--hover)}
.aud .play{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;flex-shrink:0;display:grid;place-items:center}
.aud .wave{flex:1;height:18px;position:relative;background:repeating-linear-gradient(90deg,var(--faint) 0 2px,transparent 2px 5px);border-radius:2px;
  -webkit-mask:linear-gradient(180deg,transparent 15%,#000 15%,#000 85%,transparent 85%);mask:linear-gradient(180deg,transparent 15%,#000 15%,#000 85%,transparent 85%)}
.aud .wave i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 5px);transition:width .2s linear}
.aud .x2{font-size:12px;color:var(--muted);padding:4px}
.recording{background:var(--red-bg)!important;color:var(--red-fg)!important}
.recdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red-fg);animation:blink 1s infinite;margin-right:4px}
@keyframes blink{50%{opacity:.2}}

/* ================= card de tarefas ================= */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.tcard{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 14px 8px;margin:12px 0 6px}
.tcard .th{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.tcard .th h3{margin:0;font-size:17px;font-weight:700}
.tcard .th .time{font-size:13px;color:var(--muted)}
.ring{--p:0;width:46px;height:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--green-fg) calc(var(--p) * 1%),var(--hover) 0)}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.enter .ring{animation:ringIn 1.1s var(--ios) both .15s}
@keyframes ringIn{from{--p:0}}
.tcard .task{padding:9px 6px;border-radius:8px;border-bottom:1px solid var(--line)}
.tcard .task:last-of-type{border-bottom:0}
.tcard .tsub{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--red-fg);padding:8px 6px 2px}
.tcard .tsub.n{color:var(--faint)}
.tcard .overdue{border-left:3px solid var(--red-fg);background:color-mix(in srgb,var(--red-bg) 45%,transparent);border-radius:4px 10px 10px 4px;padding:2px 4px;margin:4px 0 8px}
.tcard .overdue .task{border-bottom-color:transparent}
.tcard .quick{margin:6px 0 4px;padding:8px 10px;border-radius:8px;background:var(--hover)}
.tcard .empty{padding:6px 6px}
@media (hover:hover){.task:hover{background:var(--hover)}.tcard .overdue .task:hover{background:transparent}}
.dside{display:none}

/* alerta de confirmação (estilo iOS) */
.alert-ov{position:fixed;inset:0;z-index:55;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s}
.alert{width:100%;max-width:300px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-radius:16px;overflow:hidden;text-align:center;animation:alertIn .3s var(--spring);box-shadow:var(--shadow-lg)}
@keyframes alertIn{from{transform:scale(1.15);opacity:0}}
.alert p{margin:0;padding:20px 18px 16px;font-size:15px;line-height:1.4}
.alert .ab{display:flex;border-top:1px solid var(--line)}
.alert .ab button{flex:1;padding:12px 0;font-size:16px;color:var(--accent)}
.alert .ab button + button{border-left:1px solid var(--line);font-weight:600}
.alert .ab button.danger{color:var(--red-fg)}
.alert .ab button:active{transform:none;background:var(--press)}

/* indicador de sincronização */
.sdot{position:absolute;left:16px;bottom:15px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.sdot i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sdot span{display:none}
.sdot.ok i{background:var(--green-fg)}
.sdot.syncing i{background:var(--accent);animation:blink 1s infinite}
.sdot.error i{background:var(--red-fg)}
.sdot.off{display:none}
@media (min-width:900px){.sdot span{display:inline}}

/* ================= computador ================= */
@media (min-width:900px){
  .desk-only{display:block}
  .nav{top:0;bottom:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;padding:14px 10px;gap:2px;border-top:0;border-right:1px solid var(--line);
    background:var(--bg2);-webkit-backdrop-filter:none;backdrop-filter:none}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:6px 10px 16px}
  .nav button{flex:none;flex-direction:row;gap:10px;padding:7px 10px;font-size:14px;border-radius:6px;color:var(--muted)}
  .nav button svg{width:18px;height:18px}
  .nav button.on{background:var(--hover);color:var(--text)}
  .nav button.on svg,.nav button:active{transform:none}
  .topbar{left:232px}
  #app{margin-left:232px}
  .pagehead,main{max-width:1180px;padding-left:48px;padding-right:48px}
  main{padding-bottom:80px}
  .fab{bottom:28px;right:28px}
  .pagehead,main{max-width:1320px}
  .dtop{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
  .dtop > *{margin:0!important}
  .dtop .cd{grid-column:1/-1}
  .dside{display:block}
  .dmain{margin-top:16px}
  .dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .tcard{padding:18px 20px 12px;margin-top:14px}
  .tcard .th h3{font-size:19px}
  .tcard .task{font-size:16px;padding:10px 8px}
  .ring{width:54px;height:54px}
  .ring::before{inset:6px}
  .ring span{font-size:12px}
  .ov{align-items:center}
  .sheet{border-radius:14px;max-height:88vh;padding-bottom:24px}
  .toast{top:16px}
  .chips{margin-left:0;margin-right:0;padding:0}
}
@media (min-width:1180px){
  .dtop{grid-template-columns:1.15fr 1fr 1fr}
  .dtop .cd{grid-column:auto;flex-direction:column;align-items:stretch;justify-content:space-between;gap:10px}
  .dtop .cd .cdn{display:flex;align-items:baseline;gap:8px;text-align:left}
  .dtop .cd .cdn b{font-size:64px}
  .dtop .cd .cdn span{font-size:13px}
  .dmain{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
  .dside{position:sticky;top:62px}
  .dside .dashc{margin:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="lock" class="lock hidden">
  <img class="logo" src="icon-192.png" alt="">
  <h2>Segundo Cérebro</h2>
  <p id="lkMsg">Digite seu PIN</p>
  <div class="dots2" id="lkDots"></div>
  <div class="pad" id="lkPad"></div>
</div>

<div class="topbar" id="topbar"><span class="sdot off" id="syncDot"><i></i><span></span></span><span class="tt" id="tbTitle"></span>
  <button class="gear" data-act="tab" data-v="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>

<div id="app">
  <header class="pagehead"><span class="icon" id="phIcon">☀️</span><h1 id="title">Meu dia</h1><div class="sub" id="hsub"></div></header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" data-act="addMenu" aria-label="Adicionar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="nav">
  <div class="brand">🧠 Segundo Cérebro</div>
  <button data-act="tab" data-v="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg>Hoje</button>
  <button data-act="tab" data-v="treinos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Treinos</button>
  <button data-act="tab" data-v="conteudo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10.2 9.3v5.4l4.6-2.7z"/></svg>Conteúdo</button>
  <button data-act="tab" data-v="uber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5V12l1.8-4.6A2 2 0 0 1 8.7 6h6.6a2 2 0 0 1 1.9 1.4L19 12v4.5"/><rect x="3.5" y="12" width="17" height="5" rx="1.5"/><path d="M6 17v2M18 17v2"/></svg>Uber</button>
  <button data-act="tab" data-v="notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14.5 3.5V8H19M8.5 12.5h7M8.5 16h4.5"/></svg>Notas</button>
  <button data-act="tab" data-v="livros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Livros</button>
</nav>

<script>
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');

function ask(msg, ok = 'OK', danger = false){
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'alert-ov';
    o.innerHTML = `<div class="alert" role="alertdialog"><p></p><div class="ab"><button type="button">Cancelar</button><button type="button" class="${danger ? 'danger' : ''}"></button></div></div>`;
    o.querySelector('p').textContent = msg; o.querySelectorAll('button')[1].textContent = ok;
    const done = v => { o.remove(); res(v); };
    o.querySelectorAll('button')[0].onclick = () => done(false);
    o.querySelectorAll('button')[1].onclick = () => { buzz(); done(true); };
    o.addEventListener('click', e => { if (e.target === o) done(false); });
    document.body.appendChild(o);
  });
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());

function hours(v){ if(!v) return 0; const s = String(v); if (s.includes(':')) { const [h,m] = s.split(':').map(Number); return (h||0) + (m||0)/60; } return num(s); }

const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open('segundo-cerebro', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('photos', mode), rq = fn(t.objectStore('photos')); t.oncomplete = () => res(rq.result); t.onerror = () => rej(t.error); }); };
  return { put:(k, v) => tx('readwrite', s => s.put(v, k)), get:k => tx('readonly', s => s.get(k)), del:k => tx('readwrite', s => s.delete(k)), keys:() => tx('readonly', s => s.getAllKeys()) };
})();
async function compress(file, max = 1440, q = .8){
  let src, w, h;
  try { src = await createImageBitmap(file); w = src.width; h = src.height; }
  catch(e) { const img = new Image(); img.src = URL.createObjectURL(file); await img.decode(); src = img; w = img.naturalWidth; h = img.naturalHeight; }
  const k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}

/* visualizador de fotos: abre "crescendo" a partir da miniatura, desliza entre fotos, arraste para baixo fecha */
async function openLightbox(ids, i, fromEl){
  const lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = `<img alt=""><div class="cnt"></div><button class="cls" aria-label="Fechar">✕</button>`;
  document.body.appendChild(lb);
  const img = lb.querySelector('img'), cnt = lb.querySelector('.cnt');
  const show = async k => { i = (k + ids.length) % ids.length; img.src = await photoURL(ids[i]); cnt.textContent = ids.length > 1 ? `${i+1} de ${ids.length}` : ''; };
  await show(i); await img.decode().catch(() => {});
  if (fromEl) {
    const r = fromEl.getBoundingClientRect(), f = img.getBoundingClientRect(), k = Math.max(r.width / f.width, r.height / f.height);
    img.style.transition = 'none';
    img.style.transform = `translate(${r.left + r.width/2 - (f.left + f.width/2)}px, ${r.top + r.height/2 - (f.top + f.height/2)}px) scale(${k})`;
    void img.offsetWidth; img.style.transition = '';
  }
  requestAnimationFrame(() => { lb.classList.add('on'); img.style.transform = ''; });
  const close = () => { lb.classList.remove('on'); img.style.transform = 'scale(.85)'; img.style.opacity = '0'; setTimeout(() => lb.remove(), 350); };
  lb.querySelector('.cls').addEventListener('click', e => { e.stopPropagation(); close(); });
  let x0 = 0, y0 = 0, moved = false;
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false; }, {passive:true});
  lb.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0; moved = true;
    img.style.transition = 'none';
    if (dy > 0 && dy > Math.abs(dx)) { img.style.transform = `translateY(${dy}px) scale(${1 - dy/1500})`; lb.style.backgroundColor = `rgba(0,0,0,${.95 - dy/600})`; }
    else img.style.transform = `translateX(${dx}px)`;
  }, {passive:true});
  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    img.style.transition = ''; lb.style.backgroundColor = '';
    if (dy > 110 && dy > Math.abs(dx)) close();
    else { img.style.transform = ''; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) && ids.length > 1) { buzz(); show(i + (dx < 0 ? 1 : -1)); } }
  });
  lb.addEventListener('click', e => { if (!moved && e.target !== lb.querySelector('.cls')) close(); moved = false; });
}

/* gravação de áudio */
let rec = null;
async function startRec(btn, onDone){
  if (rec) { rec.mr.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { toast('Este navegador não permite gravar áudio aqui.'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); } catch(e) { toast('Permita o acesso ao microfone para gravar.'); return; }
  const type = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const mr = new MediaRecorder(stream, type ? {mimeType:type} : undefined), chunks = [];
  const r = rec = {mr, t0:Date.now(), label:btn.innerHTML, btn};
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(r.timer);
    r.btn.classList.remove('recording'); r.btn.innerHTML = r.label; rec = null;
    const blob = new Blob(chunks, {type: mr.mimeType || type || 'audio/mp4'});
    if (blob.size < 800) return;
    const a = {id:'a' + uid(), dur:(Date.now() - r.t0) / 1000};
    await idb.put(a.id, blob); buzz(); onDone(a);
  };
  mr.start(250); btn.classList.add('recording'); buzz();
  const tick = () => { btn.innerHTML = `<i class="recdot"></i>${fmtDur((Date.now() - r.t0) / 1000)} · parar`; };
  tick(); r.timer = setInterval(tick, 250);
}

  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, f = el.dataset.fmt === 'brl' ? brl : el.dataset.fmt === 'dec' ? (n => dec(n)) : (n => Math.round(n));

/* contagem regressiva até 31/12 */
function cdParts(){
  const now = new Date(), y = now.getFullYear(), end = new Date(y, 11, 31, 23, 59, 59), ms = Math.max(0, end - now);
  const start = new Date(y, 0, 1), pct = Math.min(100, (now - start) / (new Date(y + 1, 0, 1) - start) * 100);
  return { y, days: Math.floor(ms / 864e5), h: Math.floor(ms / 36e5) % 24, m: Math.floor(ms / 6e4) % 60, s: Math.floor(ms / 1e3) % 60, pct };
}
const cdClock = () => { const c = cdParts(); return `${pad(c.h)}h ${pad(c.m)}m ${pad(c.s)}s · ${(c.days/7).toFixed(1).replace('.',',')} semanas`; };
function countdownCard(){
  const c = cdParts();
  const msg = c.days === 0 ? 'É hoje. Feche o ano com tudo.' : c.days <= 7 ? 'Última semana. Sem desculpas.' : 'Cada dia conta. Não procrastine.';
  return `<div class="cd"><div class="cdn"><b data-count="${c.days}">${c.days}</b><span>dia${c.days===1?'':'s'}</span></div>
    <div class="cdi"><div class="cdt">até 31 de dezembro</div><div class="cdc" id="cdClock">${cdClock()}</div>
    <div class="bar"><i style="width:${c.pct.toFixed(1)}%"></i></div><div class="cdp">${Math.floor(c.pct)}% de ${c.y} já passou · ${msg}</div></div></div>`;
}

/* 31 quadradinhos do mês */
function gridCard(kind){
  const t0 = today(), p = parse(t0), y = p.getFullYear(), m = p.getMonth(), n = new Date(y, m + 1, 0).getDate(), pre = `${y}-${pad(m+1)}-`;
  const fn = kind === 'dias' ? dayScore : contentScore;
  let sq = '', full = 0;
  for (let i = 1; i <= n; i++) {
    const d = pre + pad(i), fut = d > t0, sc = fut ? 0 : fn(d);
    if (sc >= 1) full++;
    const act = kind === 'dias' ? `data-act="goDay" data-d="${d}"` : `data-act="tab" data-v="conteudo"`;
    sq += `<button class="sq ${fut ? 'fut' : sqLevel(sc)} ${d === t0 ? 'now' : ''}" style="--i:${i}" ${act} aria-label="${fmtShort(d)}: ${Math.round(sc*100)}%">${i}</button>`;
  }
  let streak = 0, d = t0; if (fn(d) < (kind === 'dias' ? 1 : .5)) d = addDays(d, -1);
  while (streak < 400 && fn(d) >= (kind === 'dias' ? 1 : .5)) { streak++; d = addDays(d, -1); }
  const title = kind === 'dias' ? '✅ Dias completos' : '🎬 Conteúdo';
  const right = kind === 'dias' || ui.tab === 'conteudo' ? `<span class="time">${full}/${p.getDate()} dias</span>` : `<button data-act="tab" data-v="conteudo">Abrir →</button>`;
  const hint = kind === 'dias' ? 'tarefas feitas + treino = 100%' : 'postou = 100% · produziu = 50%';
  const legend = `<span class="legend">${['l0','l1','l2','l3','l4'].map(l => `<i class="sq ${l}"></i>`).join('')}</span>`;
  return `<div class="card dashc"><div class="dh"><b>${title} <span class="time">· ${MO[m]}</span></b>${right}</div>
    <div class="sqs ${kind}">${sq}</div>
    <div class="dfoot"><span>${streak ? `🔥 ${streak} dia${streak>1?'s':''} seguido${streak>1?'s':''}` : hint}</span><span class="sqs ${kind}" style="margin:0;display:flex">${legend}</span></div></div>`;
}

  const tk = db.tasks.filter(inR(ws, we)), posted = db.content.filter(c => c.status === 'postado' && c.posted >= ws && c.posted <= we).length;

  const wts = db.body.filter(b => num(b.weight)).sort(byDateAsc), lastW = wts[wts.length - 1], prevW = wts.filter(b => b.date <= addDays(t0, -7)).pop();

const byDateAsc = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.ts - b.ts;
const kg = v => dec(num(v)) + ' kg';
const signKg = v => (v > 0 ? '+' : v < 0 ? '−' : '') + dec(Math.abs(v)) + ' kg';
function bodyCard(b){
  const extra = [b.fat ? `${b.fat}% gordura` : '', b.waist ? `cintura ${b.waist} cm` : ''].filter(Boolean).join(' · ');
  return `<div class="card tap" data-act="editBody" data-id="${b.id}"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
    <b style="font-size:17px">⚖️ ${num(b.weight) ? kg(b.weight) : 'Fotos'}</b><span class="time">${cap(dayName(b.date))}, ${fmtShort(b.date)}</span></div>
    ${extra?`<div class="time">${extra}</div>`:''}${b.notes?`<p class="muted" style="margin:4px 0 0;font-size:14px;white-space:pre-wrap">${esc(b.notes)}</p>`:''}${photoStrip(b.photos)}</div>`;
}
function weightChart(list){
  const days = {30:30, 90:90, 365:365, all:1e5}[ui.bodyRange];
  let pts = list.filter(b => b.date >= addDays(today(), -days));
  if (pts.length < 2) pts = list;
  const W = 340, H = 160, L = 34, R = 10, T = 12, B = 22;
  const ts = pts.map(b => parse(b.date).getTime()), vs = pts.map(b => num(b.weight));
  const t0 = Math.min(...ts), t1 = Math.max(...ts), v0 = Math.min(...vs) - .5, v1 = Math.max(...vs) + .5;
  const X = t => L + (t1 === t0 ? .5 : (t - t0) / (t1 - t0)) * (W - L - R), Y = v => T + (v1 - v) / (v1 - v0) * (H - T - B);
  const xy = pts.map((b, i) => [X(ts[i]), Y(vs[i])]);
  const line = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

/* ================= UBER ================= */
function uRange(){
  const c = ui.cal.uber, d = c.cursor;
  if (c.mode === 'dia') return [d, d];
  if (c.mode === 'semana') { const ws = weekStart(d); return [ws, addDays(ws, 6)]; }
  const p = parse(d);
  return [ymd(new Date(p.getFullYear(), p.getMonth(), 1)), ymd(new Date(p.getFullYear(), p.getMonth()+1, 0))];
}
function renderUber(){
  const c = ui.cal.uber, sg = seg('uber', [['dia','Dia'],['semana','Semana'],['mes','Mês']], c.mode, 'mode');
  if (!num(db.settings.kmL) || !num(db.settings.fuel))
    return sg + `<div class="callout blue"><span class="ci">⛽</span><div>Primeiro, me diga quantos <b>km/l</b> seu carro faz e o <b>preço da gasolina</b>. Com isso eu calculo o gasto de combustível de cada dia.<br><button class="btn sm" data-act="uberCfg">Configurar</button></div></div>`;
  const [a, b] = uRange(), list = db.uber.filter(e => e.date >= a && e.date <= b).sort((x,y) => x.date < y.date ? 1 : -1), s = uSum(list);
  const t0 = today(), cur = t0 >= a && t0 <= b, days = diffDays(b, a) + 1, worked = new Set(list.map(e => e.date)).size;
  let label, sub;
  if (c.mode === 'dia') { label = dayName(a); sub = fmtLong(a); }
  else if (c.mode === 'semana') { label = cur ? 'Esta semana' : `Semana de ${fmtShort(a)}`; sub = `${fmtShort(a)} – ${fmtShort(b)}`; }
  else { label = MO[parse(a).getMonth()]; sub = String(parse(a).getFullYear()); }
  let h = navRow(label, sub, cur);

  if (!list.length) {
    h += `<div class="callout"><span class="ci">🚗</span><div>Nenhum registro ${c.mode==='dia'?'nesse dia':c.mode==='semana'?'nessa semana':'nesse mês'}.<br><button class="btn sm" data-act="new" data-v="uber">Registrar dia de Uber</button></div></div>`;
    return sg + `<div id="carousel">${h}</div>`;
  }
  h += `<div class="hero"><small>Lucro estimado</small><div class="big ${s.lucro<0?'neg':''}" data-count="${s.lucro}" data-fmt="brl">${brl(s.lucro)}</div>
    <div class="kv"><span>Ganhos</span><b>${brl(s.ganho)}</b></div>
    <div class="kv"><span>Combustível (${dec(s.litros)} L)</span><b>− ${brl(s.comb)}</b></div>
    ${s.outros?`<div class="kv"><span>Outros gastos</span><b>− ${brl(s.outros)}</b></div>`:''}</div>`;
  h += `<div class="stats two"><div class="stat"><b data-count="${s.km}">${dec(s.km,0)}</b><span>km rodados</span></div>
    <div class="stat"><b>${s.km?brl(s.ganho/s.km):'—'}</b><span>ganho por km</span></div>
    <div class="stat"><b>${s.km?brl(s.lucro/s.km):'—'}</b><span>lucro por km</span></div>
    ${s.horas?`<div class="stat"><b>${brl(s.lucro/s.horas)}</b><span>lucro por hora</span></div>`:''}
    ${c.mode!=='dia'?`<div class="stat"><b>${worked}</b><span>dias rodados</span></div><div class="stat"><b>${brl(s.lucro/worked)}</b><span>média por dia</span></div>`:''}
    ${s.corridas?`<div class="stat"><b>${s.corridas}</b><span>corridas</span></div>`:''}</div>`;
  if (c.mode !== 'dia' && cur) {
    const elapsed = diffDays(t0, a) + 1, proj = s.lucro / elapsed * days;
    h += `<div class="callout green"><span class="ci">📈</span><div><b>Previsão: ${brl(proj)}</b> de lucro até o fim ${c.mode==='semana'?'da semana':'do mês'}, se você mantiver o ritmo dos últimos ${elapsed} dia${elapsed>1?'s':''}.</div></div>`;
  }
  if (c.mode !== 'dia') {
    const ds = [...Array(days)].map((_,i) => addDays(a, i)), vals = ds.map(d => uSum(db.uber.filter(e => e.date === d)).lucro), mx = Math.max(1, ...vals.map(Math.abs));
    h += `<div><div class="h"><h3>Lucro por dia</h3></div><div class="chart">${ds.map((d,i) => {
      const v = vals[i], pd = parse(d), lab = c.mode==='semana' ? WD[pd.getDay()] : (pd.getDate()===1 || pd.getDate()%5===0 ? pd.getDate() : '');
      return `<button class="col" data-act="uberDay" data-d="${d}" aria-label="${fmtShort(d)}: ${brl(v)}"><i class="${v<0?'neg':v===0?'zero':''}" style="height:${Math.abs(v)/mx*100}%;animation-delay:${i*(c.mode==='semana'?40:12)}ms"></i><span>${lab}</span></button>`;
    }).join('')}</div></div>`;
  }
  h += `<div><div class="h"><h3>Registros</h3><button data-act="new" data-v="uber">+ Registrar</button></div>${list.map(uberRow).join('')}</div>`;
  return sg + `<div id="carousel">${h}</div>`;
}

let sheetOnSubmit = null, sheetOnDelete = null;
function openSheet({title, html, save='Salvar', onSubmit, onDelete, onMount}){
  const old = $('#ov'); if (old) old.remove();
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="sheet" role="dialog"><div class="sh-head"><button type="button" data-act="closeSheet">${save?'Cancelar':'Fechar'}</button><b>${title}</b>
    ${save?`<button class="save" type="submit" form="shForm">${save}</button>`:'<span style="min-width:70px"></span>'}</div>
    <form id="shForm" autocomplete="off">${html}${onDelete?`<button type="button" class="btn danger block" data-act="sheetDelete">Excluir</button>`:''}</form></div>`;
  document.body.appendChild(ov); document.body.classList.add('sheet-open'); hydratePhotos(ov);
  sheetOnSubmit = onSubmit; sheetOnDelete = onDelete;
  ov.addEventListener('click', e => { if (e.target === ov) closeSheet(); });
  $('#shForm').addEventListener('submit', e => { e.preventDefault(); if (sheetOnSubmit && sheetOnSubmit(new FormData(e.target), e.target) !== false) { buzz(); closeSheet(); } });
  // arrastar para baixo para fechar (como no iOS)
  const sh = ov.querySelector('.sheet'), head = ov.querySelector('.sh-head'); let y0 = null, dy = 0;
  head.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, {passive:true});
  head.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  head.addEventListener('touchend', () => { if (y0 == null) return; y0 = null; sh.style.transition = 'transform .35s var(--ios)'; if (dy > 110) closeSheet(); else sh.style.transform = ''; });
  onMount && setTimeout(() => onMount($('#shForm')), 60);
}
function closeSheet(){
  if (rec && rec.btn.closest('#ov')) rec.mr.stop();
  const o = $('#ov'); if (!o) return;
  o.id = ''; document.body.classList.remove('sheet-open');
  const sh = o.querySelector('.sheet'); sh.style.transition = ''; sh.style.transform = '';
  o.classList.add('out'); setTimeout(() => o.remove(), 340);
}

const opts = (name, list, val, cls='', type='radio') => `<div class="opts ${cls}">${list.map(([v,l,tc]) => {

function woFields(type, f){
  return (WF[type]||[]).map(([k,l,ic,kind,x]) => {
    const v = esc(f[k] ?? ''), n = 'f_'+k;
    if (kind==='select') return prop(ic, l, opts(n, x.map(o => [o,o]), f[k] ?? x[0]));
    if (kind==='textarea') return prop(ic, l, `<textarea name="${n}" rows="2" placeholder="${x||''}">${v}</textarea>`);
    if (kind==='number') return prop(ic, l, `<input name="${n}" type="number" inputmode="numeric" min="0" value="${v}" placeholder="0">`);
    if (kind==='decimal') return prop(ic, l, `<input name="${n}" inputmode="decimal" value="${v}" placeholder="${x}">`);
    return prop(ic, l, `<input name="${n}" value="${v}" placeholder="${x||''}">`);
  }).join('');
}

let coverResults = [];
async function searchCovers(q){
  const out = [];
  try {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=12&printType=books`);
    const j = await r.json();
    for (const it of j.items || []) {
      const v = it.volumeInfo || {}, img = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail);
      if (!img) continue;
      out.push({title:v.title, author:(v.authors||[]).join(', '), pages:v.pageCount||'', cover:img.replace(/^http:/,'https:').replace('&edge=curl','') + '&fife=w400-h600'});
    }
  } catch(e){}
  if (out.length < 6) {
    try {
      const r = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=12&fields=title,author_name,cover_i,number_of_pages_median`);
      const j = await r.json();
      for (const d of j.docs || []) if (d.cover_i) out.push({title:d.title, author:(d.author_name||[]).join(', '), pages:d.number_of_pages_median||'', cover:`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`});
    } catch(e){}
  }
  return out.slice(0, 12);
}

const BYDAY = ['SU','MO','TU','WE','TH','FR','SA'];
function nextStart(r){
  const [hh, mm] = r.time.split(':').map(Number), now = new Date();
  for (let i = 0; i < 8; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, hh, mm);
    if (r.days.includes(d.getDay()) && d > now) return d;
  }
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, hh, mm);
}
const icsDate = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
const icsEsc = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function buildICS(r){
  const st = nextStart(r), en = new Date(st.getTime() + 15*60000), now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Segundo Cerebro//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    `UID:${r.id}@segundo-cerebro`, `DTSTAMP:${stamp}`, `DTSTART:${icsDate(st)}`, `DTEND:${icsDate(en)}`,
    `RRULE:FREQ=WEEKLY;BYDAY=${r.days.map(d => BYDAY[d]).join(',')}`, `SUMMARY:${icsEsc(r.title)}`, `DESCRIPTION:${icsEsc(r.msg)}`,
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(r.title)}`,'TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function calendarSheet(r){
  openSheet({ title:'Ativar notificação', save:null,
    html: `<div class="callout blue" style="margin-top:4px"><span class="ci">⏰</span><div><b>${esc(r.title)}</b><br><span class="muted">${r.days.slice().sort().map(d => WDL[d]).join(', ')} às ${r.time}${r.msg?` · ${esc(r.msg)}`:''}</span></div></div>
      <p style="font-size:15px">Quem vai te avisar é o <b>calendário do celular</b>. Assim a notificação chega mesmo com o app fechado. É só fazer isso uma vez, porque o evento se repete toda semana.</p>
      <button type="button" class="btn block" data-act="icsOpen" data-id="${r.id}">📅 Adicionar ao Calendário do celular</button>
      <button type="button" class="btn ghost block" data-act="gcal" data-id="${r.id}">Abrir no Google Agenda</button>
      <p class="time" style="margin-top:12px">iPhone: na tela que abrir, toque em "Adicionar Tudo". Google Agenda: confira se a notificação está "no horário do evento".</p>` });
}
function openICS(r){
  const ics = buildICS(r), file = new File([ics], `${r.title.replace(/[^\p{L}\d]+/gu,'-').replace(/^-|-$/g,'').slice(0,40) || 'lembrete'}.ics`, {type:'text/calendar'});
  const url = URL.createObjectURL(file);
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) { location.href = url; }
  else { const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function openGcal(r){
  const st = nextStart(r), en = new Date(st.getTime() + 15*60000), tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const u = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(r.title)}&details=${encodeURIComponent(r.msg||'')}`
    + `&dates=${icsDate(st)}/${icsDate(en)}&ctz=${encodeURIComponent(tz)}&recur=${encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY=' + r.days.map(d => BYDAY[d]).join(','))}`;
  window.open(u, '_blank');
}

/* ================= backup ================= */
let backupFile = null;
async function doBackup(){
  const data = {...db, settings:{...db.settings, pinHash:undefined}}, ids = allPhotoIds(), photos = {};
  if (ids.length) toast(`💾 Preparando backup com ${ids.length} foto${ids.length>1?'s':''}…`);
  for (const id of ids) { try { const b = await idb.get(id); if (b) photos[id] = await blobToDataURL(b); } catch(e){} }
  const json = JSON.stringify({app:'segundo-cerebro', version:3, exportedAt:new Date().toISOString(), data, photos});
  backupFile = new File([json], `segundo-cerebro-backup-${today()}.json`, {type:'application/json'});
  shareBackup();
}
async function shareBackup(){
  const file = backupFile; if (!file) return;
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'Backup Segundo Cérebro'});
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    closeSheet(); db.settings.lastBackup = Date.now(); save(); toast('💾 Backup feito');
  } catch(e) {
    if (e.name === 'NotAllowedError') {
      // o iPhone exige um toque logo antes de abrir o compartilhar; preparar as fotos demora, então pedimos mais um toque
      openSheet({ title:'Backup pronto', save:null, html:`<p>Arquivo pronto (${(file.size/1048576).toFixed(1).replace('.',',')} MB). Toque para salvar no Drive:</p><button type="button" class="btn block" data-act="shareBackup">💾 Salvar backup</button>` });
    } else if (e.name !== 'AbortError') toast('Não foi possível gerar o backup');
  }
}
function doImport(file){
  const r = new FileReader();
  r.onload = async () => {
    try {
      const j = JSON.parse(r.result), d = j.data || j;
      if (!Array.isArray(d.tasks) || !Array.isArray(d.workouts)) throw 0;
      if (!(await ask('Restaurar este backup? Os dados atuais deste aparelho serão substituídos.', 'Restaurar', true))) return;
      if (j.photos) { toast('📷 Restaurando fotos…'); for (const [id, url] of Object.entries(j.photos)) { try { await idb.put(id, await (await fetch(url)).blob()); } catch(e){} } }
      const keep = {pinHash:db.settings.pinHash, pinLen:db.settings.pinLen};
      db = {...defaults(), ...d, settings:{...defaults().settings, ...(d.settings||{}), ...keep, lastBackup:Date.now(), seeded:true}};
      save({enter:true}); toast('✅ Backup restaurado');
    } catch(e) { toast('Esse arquivo não parece ser um backup válido do Segundo Cérebro.'); }
  };
  r.readAsText(file);
}

async function hash(pin){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sc2:'+pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
let entry = '';
function showLock(){
  if (!db.settings.pinHash) return;
  entry = ''; drawDots(); $('#lkMsg').textContent = 'Digite seu PIN';
  $('#lock').classList.remove('hidden','unlock'); closeSheet();
}
function drawDots(){ $('#lkDots').innerHTML = [...Array(db.settings.pinLen||4)].map((_,i) => `<i class="${i<entry.length?'f':''}"></i>`).join(''); }
$('#lkPad').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k => k ? `<button class="${k==='⌫'?'x':''}" data-k="${k}">${k}</button>` : '<span></span>').join('');
$('#lkPad').addEventListener('click', async e => {
  const k = e.target.closest('button')?.dataset.k; if (!k) return;
  buzz();
  const len = db.settings.pinLen || 4;
  if (k === '⌫') entry = entry.slice(0, -1); else if (entry.length < len) entry += k;
  drawDots();
  if (entry.length === len){
    if (await hash(entry) === db.settings.pinHash){ const l = $('#lock'); l.classList.add('unlock'); setTimeout(() => l.classList.add('hidden'), 450); entry = ''; render({enter:true}); }
    else { const d = $('#lkDots'); d.classList.add('err'); navigator.vibrate && navigator.vibrate([30,40,30]); $('#lkMsg').textContent = 'PIN incorreto'; setTimeout(() => { d.classList.remove('err'); entry=''; drawDots(); }, 450); }
  }
});

function step(dir){
  const c = C();
  if (c.mode === 'dia') c.cursor = addDays(c.cursor, dir);
  else if (c.mode === 'semana') c.cursor = addDays(c.cursor, 7*dir);
  else { const d = parse(c.cursor); c.cursor = ymd(new Date(d.getFullYear(), d.getMonth()+dir, 1)); }
  buzz(); render({slide: dir > 0 ? 'l' : 'r'});
}

view.addEventListener('touchstart', e => {

  drag = {x:e.touches[0].clientX, y:e.touches[0].clientY, dx:0, on:false, car, t:Date.now()};

  if (!drag.on) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) { drag.on = true; drag.car.style.transition = 'none'; drag.car.style.animation = 'none'; }
    else if (Math.abs(dy) > 10) { drag = null; return; } else return;
  }
  drag.dx = dx; drag.car.style.transform = `translateX(${dx}px)`; drag.car.style.opacity = 1 - Math.min(.5, Math.abs(dx) / 700);
}, {passive:true});
view.addEventListener('touchend', () => {
  if (!drag) return; const d = drag; drag = null; if (!d.on) return;
  const vel = Math.abs(d.dx) / Math.max(1, Date.now() - d.t), car = d.car;
  car.style.transition = 'transform .25s var(--ios), opacity .25s';
  if (Math.abs(d.dx) > 80 || (vel > .5 && Math.abs(d.dx) > 30)) {
    const dir = d.dx < 0 ? 1 : -1;
    car.style.transform = `translateX(${-dir * innerWidth * .6}px)`; car.style.opacity = '0';
    setTimeout(() => step(dir), 170);
  } else { car.style.transform = ''; car.style.opacity = ''; }
}, {passive:true});

/* relógio da contagem regressiva */
setInterval(() => { const el = document.getElementById('cdClock'); if (el) el.textContent = cdClock(); }, 1000);

/* virar o dia com o app aberto */
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { for (const k in ui.cal) if (ui.cal[k].cursor === lastDay) ui.cal[k].cursor = today(); lastDay = today(); render(); } }, 60000);

/* primeiro uso: já deixa o lembrete do jiu pronto */
if (!db.settings.seeded) {
  db.reminders.push({id:'jiu-padrao', title:'Hoje é dia de jiu 🥋', msg:'Coloque o kimono no carro. Treino às 19h.', days:[1], time:'07:30', on:true});
  db.settings.seeded = true; persist();
}

render({enter:true});
showLock();
gcPhotos();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
</script>
